<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatter — Diario de Barbara</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x270F;</text></svg>">
  <style>
    @font-face {
      font-family: 'Tahoma';
      src: url('assets/fonts/tahoma.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tahoma';
      src: url('assets/fonts/tahoma-bold.woff2') format('woff2');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
      font-size: 12px;
      background: #3a6ea5;
      color: #1a1a1a;
      display: flex;
    }

    /* ── layout ── */
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #d6dfe8, #c4cdd6);
      border-right: 1px solid #8e99a4;
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 10px;
      background: linear-gradient(180deg, rgba(74,143,212,0.9), rgba(45,106,180,0.9));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
    }
    .sidebar-item {
      padding: 6px 8px;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 3px;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px;
    }
    .sidebar-item:hover { background: rgba(74,143,212,0.15); }
    .sidebar-item.active {
      background: rgba(74,143,212,0.25);
      border-color: rgba(74,143,212,0.4);
    }
    .sidebar-item img { width: 16px; height: 16px; image-rendering: pixelated; }
    .sidebar-item .emoji { font-size: 14px; }
    .sidebar-actions {
      padding: 8px;
      border-top: 1px solid #8e99a4;
    }

    .main {
      flex: 1;
      display: flex; flex-direction: column;
      background: #ece9d8;
      overflow: hidden;
    }
    .toolbar {
      padding: 6px 10px;
      background: linear-gradient(180deg, #f6f3eb, #ece9d8);
      border-bottom: 1px solid #aca899;
      display: flex; gap: 6px; align-items: center;
    }
    .editor {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .status-bar {
      padding: 4px 10px;
      background: #ece9d8;
      border-top: 1px solid #aca899;
      font-size: 10px;
      color: #666;
    }

    /* ── botones ── */
    .btn {
      padding: 4px 12px;
      font-family: inherit;
      font-size: 11px;
      border: 1px solid #7a7a7a;
      border-radius: 3px;
      background: linear-gradient(180deg, #fff, #e8e6db);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: linear-gradient(180deg, #fff, #d4d0c8); }
    .btn:active { background: #d4d0c8; }
    .btn-primary {
      background: linear-gradient(180deg, #5b9fd4, #3a7fba);
      color: #fff; border-color: #2d6494;
    }
    .btn-primary:hover { background: linear-gradient(180deg, #6daee0, #4a8fc8); }
    .btn-danger {
      background: linear-gradient(180deg, #e87060, #c4382a);
      color: #fff; border-color: #a02018;
    }
    .btn-danger:hover { background: linear-gradient(180deg, #f08070, #d4483a); }
    .btn-sm { padding: 2px 8px; font-size: 10px; }

    /* ── formulario ── */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 3px;
      font-size: 11px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 11px;
      border: 1px solid #7a7a7a;
      border-radius: 2px;
      background: #fff;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #3a7fba;
      box-shadow: 0 0 3px rgba(74,143,212,0.4);
    }
    .form-row {
      display: flex; gap: 12px;
    }
    .form-row .form-group { flex: 1; }

    .icon-option {
      display: flex; align-items: center; gap: 6px;
    }
    .icon-option img { width: 16px; height: 16px; image-rendering: pixelated; }

    /* ── mensajes ── */
    .msg-list {
      border: 1px solid #aca899;
      border-radius: 3px;
      background: #fff;
      min-height: 60px;
    }
    .msg-row {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      cursor: grab;
    }
    .msg-row:last-child { border-bottom: none; }
    .msg-row.dragging { opacity: 0.4; }
    .msg-row.drag-over { border-top: 2px solid #3a7fba; }

    .msg-sender-btn {
      padding: 2px 6px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid #7a7a7a;
      border-radius: 3px;
      cursor: pointer;
      min-width: 56px;
      text-align: center;
      flex-shrink: 0;
    }
    .msg-sender-btn.barbara {
      background: linear-gradient(180deg, #f8a4d0, #e56baa);
      color: #fff; border-color: #d45a9a;
    }
    .msg-sender-btn.usuario {
      background: linear-gradient(180deg, #a4c8f8, #6b9ae5);
      color: #fff; border-color: #5a7ad4;
    }

    .msg-content {
      flex: 1;
    }
    .msg-content textarea {
      width: 100%;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 2px;
      resize: vertical;
      min-height: 28px;
    }
    .msg-type-indicator {
      font-size: 9px;
      color: #888;
      margin-top: 2px;
    }
    .msg-actions {
      display: flex; flex-direction: column; gap: 2px;
      flex-shrink: 0;
    }

    /* ── checklist de archivos ── */
    .file-checklist {
      margin-top: 16px;
      border: 1px solid #aca899;
      border-radius: 3px;
      background: #fefefe;
      padding: 8px;
    }
    .file-checklist h3 {
      font-size: 11px;
      margin-bottom: 6px;
      color: #555;
    }
    .file-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px;
      padding: 3px 0;
    }
    .file-item .check { color: #4caf50; }
    .file-item .pending { color: #f57c00; }

    /* ── empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      font-size: 13px;
      gap: 8px;
    }
    .empty-state .icon { font-size: 48px; opacity: 0.4; }

    /* ── toast ── */
    .toast {
      position: fixed;
      bottom: 40px; right: 16px;
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">Formatter</div>
    <div class="sidebar-list" id="sidebar-list"></div>
    <div class="sidebar-actions">
      <button class="btn btn-primary" style="width:100%" onclick="newChat()">+ Nueva conversacion</button>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button class="btn" onclick="copyJSON()">Copiar JSON</button>
      <button class="btn btn-primary" onclick="downloadJSON()">Descargar data.json</button>
      <span style="flex:1"></span>
      <button class="btn btn-danger btn-sm" id="btn-delete" style="display:none" onclick="deleteChat()">Eliminar chat</button>
    </div>

    <div class="editor" id="editor">
      <div class="empty-state">
        <div class="icon">&#x1F4DD;</div>
        <div>Selecciona una conversacion o crea una nueva</div>
      </div>
    </div>

    <div class="status-bar" id="status-bar">Cargando datos...</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════
   Estado
═══════════════════════════════ */
let data = null;
let iconIndex = null;
let currentIdx = -1;

/* ═══════════════════════════════
   Cargar datos
═══════════════════════════════ */
Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('assets/icons/index.json').then(r => r.json())
]).then(([d, icons]) => {
  data = d;
  iconIndex = icons;
  renderSidebar();
  setStatus(`${data.chats.length} conversaciones cargadas`);
}).catch(err => {
  setStatus('Error cargando datos: ' + err.message);
});

/* ═══════════════════════════════
   Sidebar
═══════════════════════════════ */
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';
  data.chats.forEach((chat, idx) => {
    const el = document.createElement('div');
    el.className = 'sidebar-item' + (idx === currentIdx ? ' active' : '');
    const iconHtml = getIconHtml(chat.icono, 16);
    el.innerHTML = `${iconHtml}<span>${chat.titulo}</span>`;
    el.onclick = () => selectChat(idx);
    list.appendChild(el);
  });
}

function getIconHtml(key, size) {
  if (iconIndex && iconIndex[key]) {
    return `<img src="assets/icons/${iconIndex[key].file}" width="${size}" height="${size}" style="image-rendering:pixelated">`;
  }
  return `<span class="emoji">${key}</span>`;
}

/* ═══════════════════════════════
   Seleccionar / crear / eliminar chat
═══════════════════════════════ */
function selectChat(idx) {
  currentIdx = idx;
  renderSidebar();
  renderEditor();
  document.getElementById('btn-delete').style.display = '';
}

function newChat() {
  const chat = {
    titulo: 'Nueva conversacion',
    slug: 'nueva-conversacion-' + Date.now(),
    icono: 'msn',
    fecha: new Date().toISOString().split('T')[0],
    chat: []
  };
  data.chats.push(chat);
  currentIdx = data.chats.length - 1;
  renderSidebar();
  renderEditor();
  document.getElementById('btn-delete').style.display = '';
  setStatus('Nueva conversacion creada');
}

function deleteChat() {
  if (currentIdx < 0) return;
  const name = data.chats[currentIdx].titulo;
  if (!confirm(`Eliminar "${name}"?`)) return;
  data.chats.splice(currentIdx, 1);
  currentIdx = -1;
  renderSidebar();
  renderEmptyEditor();
  document.getElementById('btn-delete').style.display = 'none';
  setStatus(`"${name}" eliminada`);
}

/* ═══════════════════════════════
   Editor
═══════════════════════════════ */
function renderEditor() {
  if (currentIdx < 0) return renderEmptyEditor();
  const chat = data.chats[currentIdx];
  const editor = document.getElementById('editor');

  /* iconos para el select */
  const iconKeys = Object.keys(iconIndex).filter(k => !k.startsWith('_'));
  const iconOpts = iconKeys.map(k =>
    `<option value="${k}" ${k === chat.icono ? 'selected' : ''}>${k} — ${iconIndex[k].desc}</option>`
  ).join('');

  editor.innerHTML = `
    <div class="form-row">
      <div class="form-group">
        <label>Titulo</label>
        <input type="text" id="f-titulo" value="${esc(chat.titulo)}" oninput="updateField('titulo', this.value)">
      </div>
      <div class="form-group">
        <label>Slug</label>
        <input type="text" id="f-slug" value="${esc(chat.slug)}" oninput="updateField('slug', this.value)">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Icono</label>
        <select id="f-icono" onchange="updateField('icono', this.value)">${iconOpts}</select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="f-fecha" value="${chat.fecha}" oninput="updateField('fecha', this.value)">
      </div>
    </div>

    <div class="form-group">
      <label>Mensajes</label>
      <div class="msg-list" id="msg-list"></div>
      <div style="margin-top:6px">
        <button class="btn btn-sm" onclick="addMessage(1)">+ Mensaje Barbara</button>
        <button class="btn btn-sm" onclick="addMessage(2)">+ Mensaje Usuario</button>
      </div>
    </div>

    <div class="form-group">
      <label>Auto-generar slug desde titulo</label>
      <button class="btn btn-sm" onclick="autoSlug()">Generar slug</button>
    </div>

    <div id="file-checklist-area"></div>
  `;

  renderMessages();
  renderFileChecklist();
}

function renderEmptyEditor() {
  document.getElementById('editor').innerHTML = `
    <div class="empty-state">
      <div class="icon">&#x1F4DD;</div>
      <div>Selecciona una conversacion o crea una nueva</div>
    </div>`;
}

function renderMessages() {
  const chat = data.chats[currentIdx];
  const list = document.getElementById('msg-list');
  if (!list) return;
  list.innerHTML = '';

  chat.chat.forEach((msg, i) => {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.draggable = true;
    row.dataset.idx = i;

    const isVideo = typeof msg.contenido === 'string' && /\.(webm|mp4)$/i.test(msg.contenido);
    const content = isVideo
      ? msg.contenido
      : (Array.isArray(msg.contenido) ? msg.contenido.join('\n') : msg.contenido);

    const senderClass = msg.emisor === 1 ? 'barbara' : 'usuario';
    const senderLabel = msg.emisor === 1 ? 'Barbara' : 'Usuario';

    row.innerHTML = `
      <button class="msg-sender-btn ${senderClass}" onclick="toggleSender(${i})" title="Click para cambiar emisor">${senderLabel}</button>
      <div class="msg-content">
        <textarea rows="${isVideo ? 1 : Math.max(1, content.split('\n').length)}" oninput="updateMessage(${i}, this.value)">${esc(content)}</textarea>
        <div class="msg-type-indicator">${isVideo ? '&#x1F3AC; Video' : '&#x1F4AC; Texto'} ${isVideo ? '' : '(lineas separadas = parrafos)'}</div>
      </div>
      <div class="msg-actions">
        <button class="btn btn-sm" onclick="moveMessage(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Subir">&uarr;</button>
        <button class="btn btn-sm" onclick="moveMessage(${i}, 1)" ${i === chat.chat.length - 1 ? 'disabled' : ''} title="Bajar">&darr;</button>
        <button class="btn btn-danger btn-sm" onclick="removeMessage(${i})" title="Eliminar">&times;</button>
      </div>
    `;

    /* drag & drop */
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', i);
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx = i;
      if (fromIdx !== toIdx) {
        const msgs = chat.chat;
        const [moved] = msgs.splice(fromIdx, 1);
        msgs.splice(toIdx, 0, moved);
        renderMessages();
      }
    });

    list.appendChild(row);
  });
}

/* ═══════════════════════════════
   Acciones de mensajes
═══════════════════════════════ */
function addMessage(emisor) {
  if (currentIdx < 0) return;
  data.chats[currentIdx].chat.push({ emisor, contenido: [''] });
  renderMessages();
  /* focus en el ultimo textarea */
  const textareas = document.querySelectorAll('#msg-list textarea');
  if (textareas.length) textareas[textareas.length - 1].focus();
}

function removeMessage(i) {
  if (currentIdx < 0) return;
  data.chats[currentIdx].chat.splice(i, 1);
  renderMessages();
  renderFileChecklist();
}

function toggleSender(i) {
  if (currentIdx < 0) return;
  const msg = data.chats[currentIdx].chat[i];
  msg.emisor = msg.emisor === 1 ? 2 : 1;
  renderMessages();
}

function moveMessage(i, dir) {
  if (currentIdx < 0) return;
  const msgs = data.chats[currentIdx].chat;
  const newIdx = i + dir;
  if (newIdx < 0 || newIdx >= msgs.length) return;
  [msgs[i], msgs[newIdx]] = [msgs[newIdx], msgs[i]];
  renderMessages();
}

function updateMessage(i, value) {
  if (currentIdx < 0) return;
  const isVideo = /\.(webm|mp4)$/i.test(value.trim());
  if (isVideo) {
    data.chats[currentIdx].chat[i].contenido = value.trim();
  } else {
    const lines = value.split('\n').filter(l => l.length > 0);
    data.chats[currentIdx].chat[i].contenido = lines.length === 1 ? lines : lines;
  }
  renderFileChecklist();
}

/* ═══════════════════════════════
   Campos del chat
═══════════════════════════════ */
function updateField(field, value) {
  if (currentIdx < 0) return;
  data.chats[currentIdx][field] = value;
  if (field === 'titulo' || field === 'icono') renderSidebar();
}

function autoSlug() {
  if (currentIdx < 0) return;
  const titulo = data.chats[currentIdx].titulo;
  const slug = titulo.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
  data.chats[currentIdx].slug = slug;
  document.getElementById('f-slug').value = slug;
}

/* ═══════════════════════════════
   File checklist
═══════════════════════════════ */
function renderFileChecklist() {
  const area = document.getElementById('file-checklist-area');
  if (!area || currentIdx < 0) return;

  const videos = [];
  data.chats[currentIdx].chat.forEach(msg => {
    if (typeof msg.contenido === 'string' && /\.(webm|mp4)$/i.test(msg.contenido)) {
      videos.push(msg.contenido);
    }
  });

  if (videos.length === 0) {
    area.innerHTML = '';
    return;
  }

  area.innerHTML = `
    <div class="file-checklist">
      <h3>&#x1F4C1; Archivos referenciados</h3>
      ${videos.map(v => `
        <div class="file-item">
          <span class="pending">&#x25CB;</span>
          <code>${v}</code>
          <span style="color:#999;font-size:10px">— asegurate de que este archivo exista en la carpeta</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ═══════════════════════════════
   Exportar
═══════════════════════════════ */
function copyJSON() {
  const json = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showToast('JSON copiado al portapapeles');
  }).catch(() => {
    /* fallback */
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('JSON copiado al portapapeles');
  });
}

function downloadJSON() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('data.json descargado');
}

/* ═══════════════════════════════
   Utilidades
═══════════════════════════════ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
