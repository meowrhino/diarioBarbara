<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Barbara</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@400;700&family=Nunito:wght@400;600;700;900&family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      background: #1a1428;
      color: #e0d8f0;
    }

    /* ═══════════════════════════════
       WALLPAPER — animated gradient
    ═══════════════════════════════ */
    .wallpaper {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #1a1428, #2d1b4e, #1a2a3a, #2a1a3a, #1a1428);
      background-size: 500% 500%;
      animation: wallpaper-drift 25s ease infinite;
    }
    @keyframes wallpaper-drift {
      0%   { background-position: 0% 50%; }
      25%  { background-position: 100% 25%; }
      50%  { background-position: 75% 100%; }
      75%  { background-position: 25% 0%; }
      100% { background-position: 0% 50%; }
    }

    /* ── stars / noise texture ── */
    .wallpaper::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 40%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 55%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* ── scanlines ── */
    .wallpaper::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
    }

    /* ═══════════════════════════════
       DESKTOP — icon grid
    ═══════════════════════════════ */
    .desktop {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      padding: 20px;
    }

    /* ── taskbar ── */
    .taskbar {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px;
      background: rgba(10,8,20,0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .taskbar-title {
      font-family: 'VT323', monospace;
      font-size: 1rem;
      color: #e91e8c;
      letter-spacing: 1px;
    }
    .taskbar-subtitle {
      font-family: 'Caveat', cursive;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      margin-left: 8px;
    }
    .taskbar-clock {
      margin-left: auto;
      font-family: 'VT323', monospace;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
    }

    /* ── icons area ── */
    .icons-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .desktop-icon {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid transparent;
      transition: all 0.25s;
      width: 120px;
      position: relative;
    }
    .desktop-icon:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-3px);
    }
    .desktop-icon:active { transform: scale(0.95); }

    .icon-emoji {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      position: relative;
    }
    .icon-emoji::before {
      content: '';
      position: absolute; top: 2px; left: 4px; right: 4px; bottom: 55%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
      border-radius: 14px 14px 50% 50%;
      pointer-events: none;
    }
    .icon-label {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      line-height: 1.3;
    }
    .icon-date {
      font-family: 'VT323', monospace;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
    }
    .icon-new {
      position: absolute; top: 8px; right: 8px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #e91e8c;
      box-shadow: 0 0 8px #e91e8c88;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    /* ═══════════════════════════════
       CHAT WINDOW
    ═══════════════════════════════ */
    .chat-window {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .chat-window.open {
      opacity: 1;
      pointer-events: auto;
    }
    .chat-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .chat-container {
      position: relative;
      width: 100%; max-width: 520px;
      height: min(88vh, 720px);
      border-radius: 20px;
      overflow: hidden;
      display: flex; flex-direction: column;
      background: rgba(20,15,35,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.08);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .chat-window.open .chat-container {
      transform: scale(1) translateY(0);
    }

    /* ── chat header ── */
    .chat-header {
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      position: relative;
    }
    .chat-back {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-back:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .chat-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e91e8c, #6a1b9a);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 2px 10px rgba(233,30,140,0.25);
      flex-shrink: 0;
      position: relative;
    }
    .chat-avatar::after {
      content: '';
      position: absolute; top: 2px; left: 5px;
      width: 14px; height: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 100%);
      border-radius: 50%;
    }
    .chat-online {
      width: 8px; height: 8px;
      background: #4CAF50;
      border-radius: 50%;
      border: 2px solid rgba(20,15,35,0.8);
      position: absolute; bottom: 0; right: -1px;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    .chat-header-info h3 {
      font-size: 0.95rem; font-weight: 700;
      color: rgba(255,255,255,0.9);
    }
    .chat-header-info span {
      font-family: 'VT323', monospace;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
    }

    /* ── messages ── */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-body::-webkit-scrollbar { width: 3px; }
    .chat-body::-webkit-scrollbar-track { background: transparent; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .msg { display: flex; align-items: flex-end; gap: 7px; }
    .msg.user { justify-content: flex-end; }
    .msg-avatar-sm {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e91e8c, #6a1b9a);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 78%;
      padding: 9px 14px;
      font-size: 0.88rem;
      line-height: 1.5;
      position: relative;
    }
    .bubble p + p { margin-top: 4px; }

    .bubble.b-in {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px 16px 16px 4px;
      color: rgba(255,255,255,0.85);
    }
    .bubble.b-out {
      background: linear-gradient(135deg, #e91e8c33, #6a1b9a33);
      border: 1px solid rgba(233,30,140,0.15);
      border-radius: 16px 16px 4px 16px;
      color: rgba(255,255,255,0.9);
    }

    /* ── video in bubble ── */
    .video-wrap { max-width: 82%; }
    .video-box {
      position: relative;
      border-radius: 16px 16px 16px 4px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
    }
    .video-box video {
      display: block; width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .vid-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s;
    }
    .vid-play {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .vid-play::after {
      content: '';
      width: 0; height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }

    /* ── typing ── */
    .typing-wrap {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 16px;
    }
    .t-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }

    /* ── input ── */
    .chat-input {
      padding: 10px 14px;
      display: flex; gap: 8px; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .chat-input input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 9px 16px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      outline: none;
      transition: all 0.2s;
    }
    .chat-input input::placeholder { color: rgba(255,255,255,0.2); }
    .chat-input input:focus {
      background: rgba(255,255,255,0.1);
      border-color: rgba(233,30,140,0.3);
    }
    .send-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e91e8c, #6a1b9a);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.08); }
    .send-btn:active { transform: scale(0.92); }
    .send-btn svg { width: 16px; height: 16px; fill: #fff; margin-left: 1px; }

    /* ── seen ── */
    .seen-text {
      font-family: 'VT323', monospace;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.15);
      text-align: right;
      margin-top: -5px;
      padding-right: 4px;
    }

    /* ═══════════════════════════════
       ANIMATIONS
    ═══════════════════════════════ */
    .msg-enter {
      opacity: 0;
      transform: translateY(16px) scale(0.96);
    }
    .msg-enter-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bounce-dot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* ═══════════════════════════════
       RESPONSIVE
    ═══════════════════════════════ */
    @media (max-width: 560px) {
      .chat-window { padding: 0; }
      .chat-container { max-width: 100%; height: 100vh; border-radius: 0; }
      .desktop { padding: 10px; }
      .icons-area { gap: 16px; }
      .desktop-icon { width: 90px; padding: 10px; }
      .icon-emoji { width: 52px; height: 52px; font-size: 1.6rem; border-radius: 14px; }
    }
  </style>
</head>
<body>

  <!-- Wallpaper -->
  <div class="wallpaper"></div>

  <!-- Desktop -->
  <div class="desktop" id="desktop">
    <div class="taskbar">
      <span class="taskbar-title">DIARIO DE BARBARA</span>
      <span class="taskbar-subtitle">perdiendo la verguenza...</span>
      <span class="taskbar-clock" id="clock"></span>
    </div>
    <div class="icons-area" id="icons-area">
      <!-- icons injected by JS -->
    </div>
  </div>

  <!-- Chat Window -->
  <div class="chat-window" id="chat-window">
    <div class="chat-backdrop" id="chat-backdrop"></div>
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-back" id="chat-back">←</div>
        <div class="chat-avatar">
          <span>🌸</span>
          <div class="chat-online"></div>
        </div>
        <div class="chat-header-info">
          <h3>Barbara</h3>
          <span id="chat-status">en linea</span>
        </div>
      </div>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-input">
        <input type="text" id="msg-input" placeholder="Escribe algo..." autocomplete="off">
        <button class="send-btn" id="send-btn">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
(function() {

  /* ═══════════════════════════════
     CLOCK
  ═══════════════════════════════ */
  const clockEl = document.getElementById('clock');
  function updateClock() {
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  /* ═══════════════════════════════
     LOAD DATA
  ═══════════════════════════════ */
  let chatData = null;

  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      chatData = data;
      renderDesktop(data.chats);
      // open most recent chat
      if (data.chats.length > 0) {
        openChat(data.chats.length - 1);
      }
    });

  /* ═══════════════════════════════
     RENDER DESKTOP ICONS
  ═══════════════════════════════ */
  const iconsArea = document.getElementById('icons-area');

  function renderDesktop(chats) {
    iconsArea.innerHTML = '';
    chats.forEach((chat, idx) => {
      const icon = document.createElement('div');
      icon.className = 'desktop-icon';
      const isNewest = idx === chats.length - 1;
      icon.innerHTML = `
        <div class="icon-emoji">${chat.icono}</div>
        <div class="icon-label">${chat.titulo}</div>
        <div class="icon-date">${chat.fecha}</div>
        ${isNewest ? '<div class="icon-new"></div>' : ''}
      `;
      icon.addEventListener('click', () => openChat(idx));
      icon.addEventListener('dblclick', () => openChat(idx));
      iconsArea.appendChild(icon);
    });
  }

  /* ═══════════════════════════════
     CHAT WINDOW
  ═══════════════════════════════ */
  const chatWindow = document.getElementById('chat-window');
  const chatBackdrop = document.getElementById('chat-backdrop');
  const chatBack = document.getElementById('chat-back');
  const chatBody = document.getElementById('chat-body');
  const chatStatus = document.getElementById('chat-status');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  let currentTimeouts = [];

  function closeChat() {
    chatWindow.classList.remove('open');
    currentTimeouts.forEach(clearTimeout);
    currentTimeouts = [];
  }

  chatBackdrop.addEventListener('click', closeChat);
  chatBack.addEventListener('click', closeChat);

  function openChat(idx) {
    const chat = chatData.chats[idx];
    if (!chat) return;

    // clear previous
    currentTimeouts.forEach(clearTimeout);
    currentTimeouts = [];
    chatBody.innerHTML = '';

    chatWindow.classList.add('open');
    chatStatus.textContent = 'escribiendo...';

    // schedule messages
    let delay = 400;
    const msgs = chat.chat;

    msgs.forEach((msg, i) => {
      // show typing before each barbara message
      if (msg.emisor === 1 && i > 0) {
        const typingDelay = delay;
        const tid1 = setTimeout(() => showTyping(), typingDelay);
        currentTimeouts.push(tid1);
        delay += 800;
      }

      const msgDelay = delay;
      const tid2 = setTimeout(() => {
        removeTyping();
        renderMessage(msg);

        // update status
        if (i === msgs.length - 1) {
          chatStatus.textContent = 'en linea';
        } else if (msgs[i + 1] && msgs[i + 1].emisor === 1) {
          chatStatus.textContent = 'escribiendo...';
        } else {
          chatStatus.textContent = 'en linea';
        }
      }, msgDelay);
      currentTimeouts.push(tid2);

      // timing based on content type
      const isVideo = typeof msg.contenido === 'string';
      delay += isVideo ? 1800 : 1200;
    });
  }

  /* ═══════════════════════════════
     RENDER MESSAGE
  ═══════════════════════════════ */
  function renderMessage(msg) {
    const isVideo = typeof msg.contenido === 'string' && msg.contenido.match(/\.(webm|mp4)$/i);
    const isBarb = msg.emisor === 1;

    if (isVideo) {
      const wrap = document.createElement('div');
      wrap.className = 'msg';
      const vid_id = 'v' + Math.random().toString(36).substr(2, 5);
      wrap.innerHTML = `
        <div class="msg-avatar-sm">🌸</div>
        <div class="video-wrap">
          <div class="video-box" id="${vid_id}">
            <video src="${msg.contenido}" preload="metadata" playsinline></video>
            <div class="vid-overlay"><div class="vid-play"></div></div>
          </div>
        </div>
      `;
      addMsg(wrap);

      setTimeout(() => {
        const box = document.getElementById(vid_id);
        if (!box) return;
        const video = box.querySelector('video');
        const overlay = box.querySelector('.vid-overlay');
        box.addEventListener('click', () => {
          if (video.paused) { video.play(); overlay.style.opacity = '0'; }
          else { video.pause(); overlay.style.opacity = '1'; }
        });
        video.addEventListener('ended', () => { overlay.style.opacity = '1'; });
      }, 50);
    } else {
      // text message — contenido is array of paragraphs
      const paragraphs = Array.isArray(msg.contenido) ? msg.contenido : [msg.contenido];
      const wrap = document.createElement('div');
      wrap.className = `msg ${isBarb ? '' : 'user'}`;

      const bubbleClass = isBarb ? 'b-in' : 'b-out';
      const html = paragraphs.map(p => `<p>${p}</p>`).join('');

      if (isBarb) {
        wrap.innerHTML = `<div class="msg-avatar-sm">🌸</div><div class="bubble ${bubbleClass}">${html}</div>`;
      } else {
        wrap.innerHTML = `<div class="bubble ${bubbleClass}">${html}</div>`;
      }
      addMsg(wrap);
    }
  }

  function addMsg(el) {
    el.classList.add('msg-enter');
    chatBody.appendChild(el);
    el.offsetHeight;
    el.classList.add('msg-enter-active');
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  /* ═══════════════════════════════
     TYPING INDICATOR
  ═══════════════════════════════ */
  function showTyping() {
    removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'msg';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `
      <div class="msg-avatar-sm">🌸</div>
      <div class="bubble b-in typing-wrap">
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out infinite"></div>
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out 0.15s infinite"></div>
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out 0.3s infinite"></div>
      </div>
    `;
    addMsg(wrap);
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  /* ═══════════════════════════════
     USER INPUT
  ═══════════════════════════════ */
  const responses = [
    'jaja gracias! 🥺',
    'me alegra que te guste 💕',
    'pronto subo mas 🌸',
    'eso me da mucho animo!! ✨',
    'jaja ay 🥹',
    'ya casi tengo el siguiente listo! 🎬',
    'tu crees? a veces pienso que es raro jaja',
    'significa mucho, de verdad 💕',
  ];
  let respIdx = 0;

  function sendUserMsg() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';

    renderMessage({ emisor: 2, contenido: [text] });

    chatStatus.textContent = 'escribiendo...';
    const t1 = setTimeout(() => showTyping(), 800);
    const t2 = setTimeout(() => {
      removeTyping();
      renderMessage({ emisor: 1, contenido: [responses[respIdx % responses.length]] });
      respIdx++;
      chatStatus.textContent = 'en linea';
    }, 2500);
    currentTimeouts.push(t1, t2);
  }

  sendBtn.addEventListener('click', sendUserMsg);
  msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendUserMsg(); });

  // ESC to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeChat();
  });

})();
</script>

</body>
</html>
