<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✯¸.•´*¨`*•✿ ✿•*`¨*`•.¸✯</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

  <div class="wallpaper"></div>

  <!-- escritorio: solo iconos, sin taskbar -->
  <div class="desktop" id="desktop">
    <div class="icons-area" id="icons-area"></div>
  </div>

  <!-- ventana de chat -->
  <div class="chat-window" id="chat-window">
    <div class="chat-frame">
      <div class="win-titlebar">
        <span class="win-titlebar-icon">💬</span>
        <span class="win-titlebar-text">
          <span id="win-title-name">Barbara</span> —
          <span class="win-titlebar-status" id="chat-status">en linea</span>
        </span>
        <div class="win-btn-close" id="win-close">✕</div>
      </div>
      <div class="chat-body" id="chat-body"></div>
    </div>
  </div>

  <script src="js/desktop.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
