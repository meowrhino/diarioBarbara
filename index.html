<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Barbara</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Caveat:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; user-select: none; }
    body {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      background: #3a6ea5;
      color: #1a1a1a;
    }

    /* ═══════════════════════════════
       WALLPAPER — frutiger aero sky
    ═══════════════════════════════ */
    .wallpaper {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(120,180,60,0.12) 0%, transparent 40%),
        linear-gradient(180deg, #4a9fd8 0%, #7ec8e3 35%, #b8e6b8 65%, #8cc63f 100%);
    }
    /* cloud shapes */
    .wallpaper::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(120px 50px at 15% 18%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(180px 60px at 45% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(100px 40px at 75% 22%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(150px 55px at 85% 8%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(90px 35px at 25% 28%, rgba(255,255,255,0.3) 0%, transparent 100%);
      animation: cloud-drift 40s linear infinite;
    }
    @keyframes cloud-drift {
      0% { transform: translateX(0); }
      100% { transform: translateX(60px); }
    }

    /* ═══════════════════════════════
       3D BORDER UTILS (arxiu-style)
    ═══════════════════════════════ */
    .bevel-out {
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
    }
    .bevel-in {
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
    }

    /* ═══════════════════════════════
       DESKTOP
    ═══════════════════════════════ */
    .desktop {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      padding: 16px 16px 0;
    }

    /* ── icons area ── */
    .icons-area {
      flex: 1;
      display: flex;
      align-items: flex-start;
      align-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px;
    }

    .desktop-icon {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer;
      padding: 8px 6px;
      width: 90px;
      position: relative;
      border: 1px solid transparent;
    }
    .desktop-icon:hover {
      background: rgba(0,0,128,0.18);
      border-color: rgba(0,0,128,0.2);
      border-style: dotted;
    }
    .desktop-icon:active .icon-box {
      transform: translate(1px, 1px);
    }

    .icon-box {
      width: 52px; height: 52px;
      background: #ece9d8;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
      position: relative;
    }
    .icon-box::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      pointer-events: none;
    }

    .icon-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      line-height: 1.3;
      max-width: 80px;
    }
    .icon-date {
      font-family: 'VT323', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    }
    .icon-new {
      position: absolute; top: 2px; right: 2px;
      width: 8px; height: 8px;
      background: #ff5f57;
      border: 1px solid #1a1a1a;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    }

    /* ═══════════════════════════════
       TASKBAR (bottom, XP-style)
    ═══════════════════════════════ */
    .taskbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      background: linear-gradient(180deg, #3a6ea5 0%, #245b8e 40%, #1a4a7a 100%);
      border-top: 2px solid;
      border-color: #6ba3d6 transparent transparent transparent;
      min-height: 36px;
    }
    .start-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px 3px 4px;
      background: linear-gradient(180deg, #3c9a3c 0%, #267526 50%, #1a5c1a 100%);
      border: 2px solid;
      border-color: #6bce6b #0a3a0a #0a3a0a #6bce6b;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-style: italic;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    }
    .start-btn:active {
      border-color: #0a3a0a #6bce6b #6bce6b #0a3a0a;
    }
    .start-btn .start-icon {
      font-size: 16px;
      line-height: 1;
    }

    .taskbar-spacer { flex: 1; }

    .taskbar-title {
      font-family: 'VT323', monospace;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
    }

    .tray {
      display: flex; align-items: center; gap: 8px;
      padding: 2px 8px;
      background: linear-gradient(180deg, #1a4a7a, #0f3460);
      border: 1px solid;
      border-color: #0a2a4a #4a8ac0 #4a8ac0 #0a2a4a;
    }
    .tray-clock {
      font-family: 'VT323', monospace;
      font-size: 13px;
      color: #fff;
    }

    /* ═══════════════════════════════
       CHAT WINDOW (XP window chrome)
    ═══════════════════════════════ */
    .chat-window {
      position: fixed; inset: 0; z-index: 20;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px 20px 52px;
    }
    .chat-window.open {
      display: flex;
    }

    .chat-frame {
      position: relative;
      width: 100%; max-width: 480px;
      height: min(85vh, 680px);
      display: flex; flex-direction: column;
      background: #ece9d8;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.4), inset 0 0 0 1px #fff;
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
      transform: scale(0.96);
      transition: transform 0.15s ease-out;
    }
    .chat-window.open .chat-frame {
      transform: scale(1);
    }

    /* ── title bar ── */
    .win-titlebar {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px;
      background: linear-gradient(180deg, #0a246a 0%, #3a6ea5 45%, #0a246a 100%);
      cursor: default;
      flex-shrink: 0;
    }
    .win-titlebar-icon {
      font-size: 14px;
    }
    .win-titlebar-text {
      flex: 1;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-btns { display: flex; gap: 2px; }
    .win-btn {
      width: 21px; height: 21px;
      background: linear-gradient(180deg, #dce6f4 0%, #a0b4d0 100%);
      border: 1px solid;
      border-color: #fff #0a246a #0a246a #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: #0a246a;
      line-height: 1;
    }
    .win-btn:active {
      border-color: #0a246a #fff #fff #0a246a;
      padding: 1px 0 0 1px;
    }
    .win-btn-close {
      background: linear-gradient(180deg, #e8a0a0 0%, #c05050 100%);
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    }

    /* ── chat toolbar ── */
    .chat-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px;
      background: #ece9d8;
      border-bottom: 1px solid #808080;
      flex-shrink: 0;
    }
    .chat-avatar {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #e91e8c, #6a1b9a);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
      flex-shrink: 0;
      border: 1px solid;
      border-color: #fff #808080 #808080 #fff;
    }
    .chat-toolbar-info {
      flex: 1;
    }
    .chat-toolbar-info h3 {
      font-size: 11px; font-weight: 700;
      color: #1a1a1a;
    }
    .chat-toolbar-info span {
      font-family: 'VT323', monospace;
      font-size: 11px;
      color: #808080;
    }
    .online-indicator {
      width: 8px; height: 8px;
      background: #28c840;
      border: 1px solid #1a1a1a;
      display: inline-block;
      margin-right: 2px;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    /* ── messages area ── */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
      background: #fff;
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
      margin: 0 4px;
    }
    .chat-body::-webkit-scrollbar { width: 16px; }
    .chat-body::-webkit-scrollbar-track {
      background: #ece9d8;
      border-left: 1px solid #808080;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ece9d8, #c8c0b0);
      border: 1px solid;
      border-color: #fff #404040 #404040 #fff;
    }
    .chat-body::-webkit-scrollbar-button { display: block; height: 16px; background: #ece9d8; }

    /* ── message bubbles ── */
    .msg { display: flex; align-items: flex-end; gap: 5px; }
    .msg.user { justify-content: flex-end; }
    .msg-av {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #e91e8c, #6a1b9a);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      border: 1px solid;
      border-color: #fff #808080 #808080 #fff;
    }

    .bubble {
      max-width: 80%;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      font-family: 'Space Mono', monospace;
    }
    .bubble p + p { margin-top: 3px; }

    .bubble.b-in {
      background: #ece9d8;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      color: #1a1a1a;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
    }
    .bubble.b-out {
      background: linear-gradient(180deg, #e8c0d8 0%, #d898c0 100%);
      border: 2px solid;
      border-color: #f0d8e8 #804068 #804068 #f0d8e8;
      color: #1a1a1a;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }

    /* ── video ── */
    .video-wrap { max-width: 85%; }
    .video-box {
      position: relative;
      overflow: hidden;
      background: #000;
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .video-box video {
      display: block; width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .vid-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.25s;
    }
    .vid-play {
      width: 44px; height: 44px;
      background: linear-gradient(180deg, #ece9d8, #c8c0b0);
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .vid-play::after {
      content: '';
      width: 0; height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #0a246a;
      margin-left: 2px;
    }

    /* ── typing ── */
    .typing-wrap {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 12px;
    }
    .t-dot {
      width: 6px; height: 6px;
      background: #808080;
    }

    /* ── input bar ── */
    .chat-input-bar {
      padding: 4px;
      display: flex; gap: 4px; align-items: center;
      background: #ece9d8;
      flex-shrink: 0;
    }
    .chat-input-bar input {
      flex: 1;
      background: #fff;
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
      padding: 4px 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #1a1a1a;
      outline: none;
    }
    .chat-input-bar input::placeholder { color: #aaa; }
    .chat-input-bar input:focus {
      border-color: #0a246a #8ab4d8 #8ab4d8 #0a246a;
    }
    .send-btn {
      padding: 3px 12px;
      background: linear-gradient(180deg, #ece9d8, #c8c0b0);
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
    }
    .send-btn:active {
      border-color: #404040 #fff #fff #404040;
      padding: 4px 11px 2px 13px;
    }

    /* ── statusbar ── */
    .chat-statusbar {
      padding: 2px 6px;
      background: #ece9d8;
      border-top: 1px solid #808080;
      font-family: 'VT323', monospace;
      font-size: 11px;
      color: #808080;
      display: flex; gap: 8px;
    }

    /* ═══════════════════════════════
       ANIMATIONS
    ═══════════════════════════════ */
    .msg-enter {
      opacity: 0;
      transform: translateY(12px);
    }
    .msg-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    }
    @keyframes bounce-dot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .icon-enter {
      opacity: 0;
      transform: translateY(12px) rotate(-1deg);
    }
    .icon-enter-active {
      opacity: 1;
      transform: translateY(0) rotate(0);
      transition: all 0.3s ease-out;
    }

    /* ═══════════════════════════════
       RESPONSIVE
    ═══════════════════════════════ */
    @media (max-width: 560px) {
      .chat-window { padding: 0 0 40px; }
      .chat-frame { max-width: 100%; height: calc(100vh - 40px); border: none; box-shadow: none; }
      .desktop { padding: 8px 8px 0; }
      .icons-area { gap: 4px; }
      .desktop-icon { width: 76px; }
      .icon-box { width: 44px; height: 44px; font-size: 1.5rem; }
      .taskbar { min-height: 32px; }
    }
  </style>
</head>
<body>

  <!-- Wallpaper -->
  <div class="wallpaper"></div>

  <!-- Desktop -->
  <div class="desktop" id="desktop">
    <div class="icons-area" id="icons-area"></div>

    <!-- Taskbar (XP bottom bar) -->
    <div class="taskbar">
      <div class="start-btn">
        <span class="start-icon">🌸</span>
        barbara
      </div>
      <span class="taskbar-title">diario de barbara — perdiendo la verguenza, un video a la vez</span>
      <div class="taskbar-spacer"></div>
      <div class="tray">
        <span class="tray-clock" id="clock"></span>
      </div>
    </div>
  </div>

  <!-- Chat Window -->
  <div class="chat-window" id="chat-window">
    <div class="chat-frame">
      <!-- XP Title Bar -->
      <div class="win-titlebar">
        <span class="win-titlebar-icon">💬</span>
        <span class="win-titlebar-text" id="win-title">Barbara - Chat</span>
        <div class="win-btns">
          <div class="win-btn">─</div>
          <div class="win-btn">□</div>
          <div class="win-btn win-btn-close" id="win-close">✕</div>
        </div>
      </div>
      <!-- Toolbar -->
      <div class="chat-toolbar">
        <div class="chat-avatar">🌸</div>
        <div class="chat-toolbar-info">
          <h3>Barbara</h3>
          <span><span class="online-indicator"></span> <span id="chat-status">en linea</span></span>
        </div>
      </div>
      <!-- Messages -->
      <div class="chat-body" id="chat-body"></div>
      <!-- Input -->
      <div class="chat-input-bar">
        <input type="text" id="msg-input" placeholder="escribe algo..." autocomplete="off">
        <button class="send-btn" id="send-btn">enviar</button>
      </div>
      <!-- Status bar -->
      <div class="chat-statusbar">
        <span id="msg-count">0 mensajes</span>
      </div>
    </div>
  </div>

<script>
(function() {

  const clockEl = document.getElementById('clock');
  function updateClock() {
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  let chatData = null;
  let msgTotal = 0;

  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      chatData = data;
      renderDesktop(data.chats);
      if (data.chats.length > 0) openChat(data.chats.length - 1);
    });

  const iconsArea = document.getElementById('icons-area');

  function renderDesktop(chats) {
    iconsArea.innerHTML = '';
    chats.forEach((chat, idx) => {
      const icon = document.createElement('div');
      icon.className = 'desktop-icon icon-enter';
      const isNewest = idx === chats.length - 1;
      icon.innerHTML = `
        <div class="icon-box">${chat.icono}</div>
        <div class="icon-label">${chat.titulo}</div>
        <div class="icon-date">${chat.fecha}</div>
        ${isNewest ? '<div class="icon-new"></div>' : ''}
      `;
      icon.addEventListener('dblclick', () => openChat(idx));
      iconsArea.appendChild(icon);
      // staggered entrance
      setTimeout(() => {
        icon.classList.add('icon-enter-active');
      }, idx * 80 + 50);
    });
  }

  const chatWindow = document.getElementById('chat-window');
  const winClose = document.getElementById('win-close');
  const winTitle = document.getElementById('win-title');
  const chatBody = document.getElementById('chat-body');
  const chatStatus = document.getElementById('chat-status');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const msgCount = document.getElementById('msg-count');

  let currentTimeouts = [];

  function closeChat() {
    chatWindow.classList.remove('open');
    currentTimeouts.forEach(clearTimeout);
    currentTimeouts = [];
  }

  winClose.addEventListener('click', closeChat);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChat(); });

  function openChat(idx) {
    const chat = chatData.chats[idx];
    if (!chat) return;

    currentTimeouts.forEach(clearTimeout);
    currentTimeouts = [];
    chatBody.innerHTML = '';
    msgTotal = 0;

    winTitle.textContent = 'Barbara - ' + chat.titulo;
    chatWindow.classList.add('open');
    chatStatus.textContent = 'escribiendo...';
    msgCount.textContent = '0 mensajes';

    let delay = 400;
    const msgs = chat.chat;

    msgs.forEach((msg, i) => {
      if (msg.emisor === 1 && i > 0) {
        const td = delay;
        currentTimeouts.push(setTimeout(() => showTyping(), td));
        delay += 800;
      }

      const md = delay;
      currentTimeouts.push(setTimeout(() => {
        removeTyping();
        renderMessage(msg);
        msgTotal++;
        msgCount.textContent = msgTotal + ' mensaje' + (msgTotal !== 1 ? 's' : '');

        if (i === msgs.length - 1) {
          chatStatus.textContent = 'en linea';
        } else if (msgs[i + 1] && msgs[i + 1].emisor === 1) {
          chatStatus.textContent = 'escribiendo...';
        } else {
          chatStatus.textContent = 'en linea';
        }
      }, md));

      delay += (typeof msg.contenido === 'string') ? 1800 : 1200;
    });
  }

  function renderMessage(msg) {
    const isVideo = typeof msg.contenido === 'string' && msg.contenido.match(/\.(webm|mp4)$/i);
    const isBarb = msg.emisor === 1;

    if (isVideo) {
      const wrap = document.createElement('div');
      wrap.className = 'msg';
      const vid_id = 'v' + Math.random().toString(36).substr(2, 5);
      wrap.innerHTML = `
        <div class="msg-av">🌸</div>
        <div class="video-wrap">
          <div class="video-box" id="${vid_id}">
            <video src="${msg.contenido}" preload="metadata" playsinline></video>
            <div class="vid-overlay"><div class="vid-play"></div></div>
          </div>
        </div>
      `;
      addMsg(wrap);
      setTimeout(() => {
        const box = document.getElementById(vid_id);
        if (!box) return;
        const video = box.querySelector('video');
        const overlay = box.querySelector('.vid-overlay');
        box.addEventListener('click', () => {
          if (video.paused) { video.play(); overlay.style.opacity = '0'; }
          else { video.pause(); overlay.style.opacity = '1'; }
        });
        video.addEventListener('ended', () => { overlay.style.opacity = '1'; });
      }, 50);
    } else {
      const paragraphs = Array.isArray(msg.contenido) ? msg.contenido : [msg.contenido];
      const wrap = document.createElement('div');
      wrap.className = `msg ${isBarb ? '' : 'user'}`;
      const bc = isBarb ? 'b-in' : 'b-out';
      const html = paragraphs.map(p => `<p>${p}</p>`).join('');
      if (isBarb) {
        wrap.innerHTML = `<div class="msg-av">🌸</div><div class="bubble ${bc}">${html}</div>`;
      } else {
        wrap.innerHTML = `<div class="bubble ${bc}">${html}</div>`;
      }
      addMsg(wrap);
    }
  }

  function addMsg(el) {
    el.classList.add('msg-enter');
    chatBody.appendChild(el);
    el.offsetHeight;
    el.classList.add('msg-enter-active');
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  function showTyping() {
    removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'msg';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `
      <div class="msg-av">🌸</div>
      <div class="bubble b-in typing-wrap">
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out infinite"></div>
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out 0.15s infinite"></div>
        <div class="t-dot" style="animation:bounce-dot 0.6s ease-in-out 0.3s infinite"></div>
      </div>
    `;
    addMsg(wrap);
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  const responses = [
    'jaja gracias! 🥺', 'me alegra que te guste 💕', 'pronto subo mas 🌸',
    'eso me da mucho animo!! ✨', 'jaja ay 🥹', 'ya casi tengo el siguiente listo! 🎬',
    'tu crees? a veces pienso que es raro jaja', 'significa mucho, de verdad 💕',
  ];
  let respIdx = 0;

  function sendUserMsg() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';
    renderMessage({ emisor: 2, contenido: [text] });
    msgTotal++;
    msgCount.textContent = msgTotal + ' mensajes';

    chatStatus.textContent = 'escribiendo...';
    currentTimeouts.push(setTimeout(() => showTyping(), 800));
    currentTimeouts.push(setTimeout(() => {
      removeTyping();
      renderMessage({ emisor: 1, contenido: [responses[respIdx % responses.length]] });
      respIdx++;
      msgTotal++;
      msgCount.textContent = msgTotal + ' mensajes';
      chatStatus.textContent = 'en linea';
    }, 2500));
  }

  sendBtn.addEventListener('click', sendUserMsg);
  msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendUserMsg(); });

})();
</script>

</body>
</html>
