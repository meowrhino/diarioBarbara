<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·:* caritas — diario de barbara *:·</title>
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tahoma', sans-serif;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.72  0 0 0 0 0.26  0 0 0 0 0.04  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
        radial-gradient(ellipse at 30% 0%, #f0701a 0%, #e85a13 45%, #b8420c 100%);
      background-attachment: fixed;
      color: #1a0f08;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #b8420c;
      text-shadow: 2px 2px 0 #ffd338, 4px 4px 0 #1a0f08;
      text-align: center;
      margin-bottom: 6px;
      line-height: 1;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #fff3e0;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-style: italic;
    }
    .grid {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .item {
      background: #fff3e0;
      border: 2px solid #1a0f08;
      box-shadow: 3px 3px 0 #1a0f08;
      padding: 14px 8px;
      text-align: center;
    }
    .face-box {
      width: 64px; height: 64px;
      background: #ffd338;
      border: 2px solid #1a0f08;
      box-shadow: 2px 2px 0 #1a0f08;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .face-box svg { width: 56px; height: 56px; display: block; }
    .key {
      font-size: 11px;
      font-weight: 700;
      color: #b8420c;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.3;
    }
    .num {
      font-size: 9px;
      color: #1a0f08;
      opacity: 0.5;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    a.back {
      display: inline-block;
      margin-top: 32px;
      font-size: 11px;
      color: #ffd338;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid #ffd338;
      padding: 0 4px 2px;
    }
    a.back:hover { color: #fff; border-color: #fff; }
    .footer-link { text-align: center; }
  </style>
</head>
<body>

  <h1>·:* caritas *:·</h1>
  <p class="subtitle">set kawaii — emociones &amp; conceptos · barbara</p>

  <div class="grid" id="grid"></div>

  <div class="footer-link">
    <a class="back" href="index.html">‹ volver al portal</a>
  </div>

  <!-- Loader con cache-busting -->
  <script>
    (async () => {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'js/caritas.js?t=' + Date.now();
        s.onload = res;
        s.onerror = rej;
        document.body.appendChild(s);
      });
      const grid = document.getElementById('grid');
      Object.entries(CARITAS).forEach(([key, svg], i) => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <div class="num">${String(i + 1).padStart(2, '0')}</div>
          <div class="face-box">${svg}</div>
          <div class="key">${key}</div>`;
        grid.appendChild(item);
      });
    })();
  </script>

</body>
</html>
